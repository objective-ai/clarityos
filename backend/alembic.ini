# Alembic Configuration File
# ClarityOS EHR - Async migration environment (asyncpg)

[alembic]
# Path to migration scripts (relative to backend/)
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Timezone for migration revision timestamps
# timezone =

# Maximum length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during `alembic revision --autogenerate`
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Version number format: left-zero-padded decimal
# output_encoding = utf-8

# Left empty intentionally -- overridden by env.py from settings.DATABASE_URL
sqlalchemy.url =


[post_write_hooks]
# Uncomment to run formatters after autogenerate
# hooks = black
# black.type = console_scripts
# black.entrypoint = black


# ── Logging ──────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
